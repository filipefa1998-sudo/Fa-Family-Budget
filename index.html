<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F8EC">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fa Budget">
<meta name="robots" content="noindex">
<title>Fa Family Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column "tide pool" — a glass jar hero that drains as money is spent, quiet ledger lists below, tab bar at the bottom. */
:root{
  /* spring: new-leaf ground, mint water, blossom accent — one light look on purpose */
  --bg:#F4F8EC; --surface:#FFFFFF; --raise:#FAFCF5; --ink:#24372B; --muted:#6A7C6E; --line:#DCE7D2;
  --water:#8ED6B0; --water2:#3FA97C; --gold:#F28BA8; --gold-ink:#4A1426; --over:#DE5F5C; --ok:#3A9E72; --warn:#E2A43A;
  --sky:#DDEFF6; --butter:#FFF3C4;
  --glass:rgba(36,55,43,.07);
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:radial-gradient(900px 420px at 85% -80px,var(--sky),transparent 70%),radial-gradient(700px 360px at -10% 10%,var(--butter),transparent 70%),var(--bg);background-attachment:fixed}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
body{margin:0;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 110px}
body.gated .tabs{display:none}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-card{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px}
.gate-card p{margin:0;color:var(--muted)} .gate-card b{color:var(--ink)} .gate-card code{font-size:13px;background:var(--glass);padding:1px 5px;border-radius:5px}
#gateJar{width:180px;height:150px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.amt{font-weight:600;white-space:nowrap}
.neg{color:var(--over)} .pos{color:var(--ok)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600}
.banner{border:1px dashed var(--warn);color:var(--ink);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:center;margin-bottom:20px}
.hero-text{min-width:0}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1.02;letter-spacing:-.03em;margin:6px 0 8px}
.big.over{color:var(--over)}
.hero-sub{font-size:14px;color:var(--muted)}
.hero-sub b{color:var(--ink);font-weight:600}
.jarbox{position:relative;min-width:0}
#jar{width:100%;height:250px;display:block;touch-action:none;cursor:crosshair}
.jarhint{display:block;text-align:right;margin-top:2px;font-size:11px;color:var(--muted)}
.mini-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.mini-stats div{display:flex;flex-direction:column}
.mini-stats span{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
@media (max-width:620px){ .hero{grid-template-columns:1fr} #jar{height:170px} }

/* sections */
section{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:16px;font-weight:700}
.link{background:none;border:0;padding:4px 0;color:var(--water2);font-weight:600;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
button.item:hover{background:var(--raise)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--water)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 18%,transparent)}
.chip.over{border-color:var(--over);color:var(--over)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.rx{font-size:12px;margin-left:4px}

/* attention cards */
.attn{display:flex;flex-direction:column;gap:8px}
.attn-card{display:flex;gap:12px;align-items:center;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:var(--r);padding:12px 14px}
.attn-card .main{flex:1;min-width:0}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--over);color:var(--over)}
.btn.sm{padding:6px 12px;font-size:13px}

/* budget bars (little vessels) */
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.cat:first-child{border-top:0}
.cat:hover{background:var(--raise)}
.cat .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .lf{text-align:right;font-weight:600}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--glass);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--water2),var(--water))}
.bar i.over{background:var(--over)}
.bar i.warn{background:var(--warn)}
.cat .meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px;background:var(--raise);border-top:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.group-h:first-child{border-top:0}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{font-family:var(--f-display);font-weight:500;font-size:15px;min-width:9.5em;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flexcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.flexcard .big{font-size:clamp(28px,7vw,40px)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cal .dow{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{min-height:58px;border-radius:8px;padding:4px;font-size:11px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d.today{outline:2px solid var(--water)}
.cal .d.blank{background:transparent}
.cal .d .n{font-weight:700;color:var(--muted)}
.cal .pill{font-size:10px;font-weight:600;border-radius:5px;padding:1px 4px;background:color-mix(in srgb,var(--gold) 28%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .pill.paid{background:color-mix(in srgb,var(--ok) 22%,transparent);text-decoration:line-through;opacity:.8}
@media (max-width:480px){ .cal .pill{font-size:0;height:6px;padding:0} .cal .d{min-height:44px} }

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.goal:hover{border-color:var(--water)}
.goal .ring{display:flex;align-items:center;gap:12px}
.goal canvas{width:56px;height:56px;flex:none}
.goal .t{font-weight:700}
.goal .s{font-size:12.5px;color:var(--muted)}
.nw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.nw svg{width:100%;height:150px;display:block}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:12px;min-width:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--water)}
.fab{border:0;width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:28px;font-weight:700;line-height:1;box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 40%,transparent);margin-top:-22px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(36,55,43,.28);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:20px} }
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.money-in{font-family:var(--f-display);font-size:32px !important;font-weight:700;letter-spacing:-.02em;padding:8px 12px !important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raise);margin-bottom:12px;font-size:14px}
.check input{margin-top:3px;accent-color:var(--water2)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.actions .spacer{flex:1}
.err{color:var(--over);font-size:13px;min-height:1em}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.reacts button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 10px;font-size:15px}
.reacts button[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 18%,var(--raise))}
.reacts small{font-size:11px;color:var(--muted);margin-left:3px}
.comment{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.comment b{font-size:12px;color:var(--muted);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.fun{background:var(--surface);border:1px dashed var(--water);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center}
.fun .main{flex:1;min-width:0}
/* ---- easy mode: bigger text, bigger targets ---- */
body{font-size:16.5px}
.eyebrow{font-size:12.5px;letter-spacing:.08em}
.hero-sub{font-size:15.5px}
.mini-stats{font-size:15px}
.mini-stats span{font-size:12px}
.sec-h h2{font-size:18px}
.link{font-size:15px}
.item{padding:14px 16px}
.item .s{font-size:14px}
.btn{min-height:46px;padding:11px 18px;font-size:15.5px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14.5px}
.chips{gap:8px}
.chips button{padding:10px 14px;font-size:15px}
.field label,.lbl{font-size:13px;letter-spacing:.04em}
.field input,.field select{padding:12px 14px;font-size:16px}
.tab{font-size:12.5px}
.chip{font-size:12.5px;padding:3px 9px}
.cat .meta,.group-h{font-size:13px}
.toast{display:flex;align-items:center;gap:14px;font-size:15px;padding:12px 18px;bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));box-shadow:0 8px 24px rgba(36,55,43,.25)}
.item .t,.item .s{display:block}
.toast button{background:none;border:0;color:var(--water);font-weight:800;font-size:15px;text-decoration:underline;padding:0}
/* status pill */
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:5px 12px;border-radius:999px;margin-bottom:8px}
.status.good{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.status.slow{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#8A5A0B}
.status.stop{background:color-mix(in srgb,var(--over) 16%,transparent);color:var(--over)}
/* the two big buttons */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qbtn{border:0;border-radius:18px;padding:14px 10px;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;line-height:1.15}
.qbtn .ic{font-size:32px;line-height:1}
.qbtn.spend{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 35%,transparent)}
.qbtn.paid{background:var(--ok);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--ok) 30%,transparent)}
.sortcard{display:flex;align-items:center;gap:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-radius:var(--r);padding:14px 16px}
.sortcard .main{flex:1;min-width:0;font-weight:600}
/* keypad entry */
.step-h{font-family:var(--f-display);font-weight:500;font-size:19px;text-align:center;margin:0 0 4px}
.pad-amt{font-family:var(--f-display);font-weight:700;font-size:52px;letter-spacing:-.03em;text-align:center;margin:4px 0 2px;min-height:64px;overflow:hidden;text-overflow:ellipsis}
.pad-amt.empty{color:var(--line)}
.pad-sub{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:62px;border-radius:16px;border:1px solid var(--line);background:var(--raise);font-size:28px;font-weight:600;touch-action:manipulation}
.keys button:active{background:var(--line)}
.wide{width:100%;min-height:58px;font-size:18px;margin-top:12px}
.more-link{display:block;margin:12px auto 0;text-align:center}
.extra{margin-top:12px}
.bigcats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigcat{border:1px solid var(--line);background:var(--raise);border-radius:16px;padding:12px 8px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:16px;font-weight:700;text-align:center;line-height:1.2;touch-action:manipulation}
.bigcat .ic{font-size:30px;line-height:1}
.bigcat:active{background:var(--line)}
.bigcat.unsure{border-style:dashed}
.backrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){ .sheet{animation:none} }
</style>
</head>
<body class="gated">
<div id="gate" hidden></div>


<div class="wrap" id="app" hidden>
  <div class="top">
    <div class="brand">Fa Family Budget<small id="who">Loading…</small></div>
    <button class="iconbtn" id="settingsBtn" type="button">Settings</button>
  </div>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-tab="home" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M5 20c0-5 3-7 7-7s7 2 7 7z"/></svg>Home</button>
    <button class="tab" data-tab="budget" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h6"/></svg>Budget</button>
    <button class="fab" id="addBtn" type="button" aria-label="Add money spent or money that came in">+</button>
    <button class="tab" data-tab="bills" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Bills</button>
    <button class="tab" data-tab="goals" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  </div>
</nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
// Fa Family Budget — Firebase settings.
// 1) Paste the config object from Firebase console → Project settings → Your apps → Web app.
// 2) List the two Google accounts allowed to use the app (must match firestore.rules).
// These values are safe to keep in a public repo: the database is protected by firestore.rules, not by hiding this file.
window.FFB_CONFIG = {

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const mkey = s => s.slice(0, 7);
const curMonth = () => mkey(todayStr());
const addMonths = (mk, n) => { let [y, m] = mk.split("-").map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const monthDiff = (a, b) => { const [ya, ma] = a.split("-").map(Number), [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
const dim = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const monthName = (mk, short) => { const [y, m] = mk.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString(undefined, { month: short ? "short" : "long", year: short ? undefined : "numeric" }); };
const dayLabel = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const money = (c, cents) => { const v = (c || 0) / 100; const neg = v < 0; const s = Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }); return (neg ? "−$" : "$") + s; };
const parseMoney = s => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? Math.round(n * 100) : NaN; };
const uidGen = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function toast(msg, undo) {
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? `<button type="button" id="undoBtn">Undo</button>` : ""}</div>`;
  if (undo) $("#undoBtn").onclick = () => { r.innerHTML = ""; clearTimeout(toast.t); undo(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", undo ? 6000 : 2800);
}

/* ---------- state ---------- */
const S = {
  uid: null, names: {},
  settings: {}, cats: [], txns: [], bills: [], goals: [], accts: [], members: [], fun: [],
  month: curMonth(), billMonth: curMonth(), tab: "home", loaded: false
};
try { const t = localStorage.getItem("ffb-tab"); if (t) S.tab = t; } catch (e) {}

/* ---------- storage layer (Firebase Firestore) ---------- */
const store = {
  db: null, unsubs: [],
  listen(path, cb) {
    const u = this.db.collection(path).onSnapshot(snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn(path, e); if (e.code === "permission-denied") showGate("denied"); });
    this.unsubs.push(u);
  },
  stopAll() { this.unsubs.forEach(u => u()); this.unsubs = []; },
  set(path, id, data) { return this.db.collection(path).doc(id).set(data); },
  update(path, id, patch) { return this.db.collection(path).doc(id).update(patch); },
  del(path, id) { return this.db.collection(path).doc(id).delete(); }
};
async function save(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    toast(code === "permission-denied" ? "This account isn't allowed to make changes. Sign in with one of the household emails."
      : code === "resource-exhausted" ? "The free Firebase limit for today is used up. Try again tomorrow."
      : code === "unavailable" ? "Couldn't reach the database. Your change will sync when you're back online."
      : "That didn't save. Check your internet and try again.");
    return false;
  }
}
const privPath = () => "data/users/" + S.uid;

/* ---------- people ---------- */
const partnerId = () => (S.members.find(m => m.id !== S.uid) || {}).id || null;
const nameOf = id => !id ? "" : id === S.uid ? "You" : (S.names[id] || "Partner");
const possessive = id => id === S.uid ? "Yours" : (S.names[id] ? S.names[id] + "'s" : "Partner's");
function resolveNames() { S.members.forEach(m => { if (m.name) S.names[m.id] = m.name; }); }
const cfgName = email => ((window.FFB_CONFIG || {}).names || {})[(email || "").toLowerCase()] || "";
/* everyone who can earn money in this house, by email, with the name to show */
function earners() {
  const emails = ((window.FFB_CONFIG || {}).householdEmails || []).map(e => e.toLowerCase());
  return emails.map(email => { const m = S.members.find(x => (x.email || "").toLowerCase() === email); return { email, name: (m && m.name) || cfgName(email) || email.split("@")[0] }; });
}

/* ---------- money in: who got paid, and what kind ---------- */
const PAY_KINDS = [["pay", "Paycheck", "💵"], ["overtime", "Overtime", "⏱️"], ["commission", "Commission / bonus", "💼"], ["side", "Side hustle", "🛠️"], ["other", "Other money", "🎁"]];
const kindOf = k => PAY_KINDS.find(x => x[0] === k) || PAY_KINDS[0];
const BOTH = "Both of us";
function payLabel(who, kind) {
  const word = { pay: "paycheck", overtime: "overtime", commission: "commission / bonus", side: "side hustle", other: "other money" }[kind] || "paycheck";
  return who && who !== BOTH ? `${who}'s ${word}` : kindOf(kind)[1];
}
/* who was paid, for older entries too */
const earnerOf = t => t.earner || (/^(.+)'s (paycheck|overtime|commission)/.exec(t.payee || "") || [])[1] || "";

/* ---------- category icons ---------- */
const ICONS = { groceries: "🛒", dining: "🍔", gas: "⛽", household: "🧺", kids: "🧒", family: "🎉", carmaint: "🔧", gifts: "🎁", annual: "📅",
  mortgage: "🏡", utilities: "💡", phone: "📱", insurance: "🛡️", car: "🚗", tithing: "⛪", fastoffering: "🙏" };
const ICON_WORDS = [[/grocer|food|costco|walmart/i, "🛒"], [/dining|eat|restaurant|fast food/i, "🍔"], [/gas|fuel/i, "⛽"], [/kid|child|school/i, "🧒"], [/house|home/i, "🧺"],
  [/gift|christmas|holiday/i, "🎁"], [/car|auto/i, "🚗"], [/medic|doctor|health|pharm/i, "💊"], [/cloth/i, "👕"], [/church|tith|offering/i, "⛪"], [/fun|entertain/i, "🎈"],
  [/util|power|electric|water/i, "💡"], [/phone|internet/i, "📱"], [/insur/i, "🛡️"], [/pet/i, "🐾"], [/travel|trip/i, "✈️"], [/save|saving/i, "🐷"], [/debt|loan|card/i, "💳"]];
const iconOf = c => !c ? "❓" : ICONS[c.id] || (ICON_WORDS.find(([re]) => re.test(c.name)) || [0, "🏷️"])[1];

/* ---------- money math ---------- */
const catById = id => S.cats.find(c => c.id === id);
const txnsIn = mk => S.txns.filter(t => t.date && mkey(t.date) === mk);
const spentIn = (mk, catId) => txnsIn(mk).filter(t => t.type !== "income" && (catId === undefined || t.categoryId === catId)).reduce((a, t) => a + (t.amount || 0), 0);
const incomeIn = mk => txnsIn(mk).filter(t => t.type === "income").reduce((a, t) => a + (t.amount || 0), 0);
// Only money that has actually come in counts. (The "usual pay" setting is just for comparison.)
const plannedIncome = mk => incomeIn(mk);

function billDue(b, mk) {
  const start = b.startMonth || mk;
  const diff = monthDiff(start, mk);
  if (diff < 0) return false;
  if (b.freq === "quarterly") return diff % 3 === 0;
  if (b.freq === "yearly") return diff % 12 === 0;
  return true;
}
const billsIn = mk => S.bills.filter(b => billDue(b, mk)).map(b => {
  const dueDate = (b.dueOn && b.dueOn[mk]) || `${mk}-${pad(Math.min(b.dueDay || 1, dim(mk)))}`;
  const base = { ...b, dueDate, day: Number(dueDate.slice(8)), moved: !!(b.dueOn && b.dueOn[mk]) };
  if (b.split) {
    // paid in parts (like Flex rent): each part is its own payment with its own date
    const dueAmt = (b.amtOn && b.amtOn[mk]) || b.amount || 0;
    const parts = ((b.parts && b.parts[mk]) || []).map(id => S.txns.find(t => t.id === id)).filter(Boolean).sort((x, y) => x.date.localeCompare(y.date));
    const sum = parts.reduce((a, t) => a + t.amount, 0);
    return { ...base, dueAmt, parts, partSum: sum, paid: dueAmt > 0 && sum >= dueAmt, remaining: Math.max(0, dueAmt - sum), paidDate: parts.length ? parts[parts.length - 1].date : null, paidAmt: sum };
  }
  const tid = b.paid && b.paid[mk], tx = tid ? S.txns.find(t => t.id === tid) : null;
  return { ...base, dueAmt: b.amount || 0, paid: !!tid, remaining: tid ? 0 : (b.amount || 0), paidTxn: tx, paidDate: tx ? tx.date : null, paidAmt: tx ? tx.amount : (b.amount || 0) };
}).filter(b => !(S.settings.startedOn && b.dueDate < S.settings.startedOn && !b.paid && !(b.parts && b.parts.length))) // due before a fresh start: not counted
  .sort((a, b) => a.day - b.day);
const goalContribIn = (g, mk) => (g.log || []).filter(l => l.d && mkey(l.d) === mk).reduce((a, l) => a + l.amt, 0);
const goalPlanRemaining = mk => S.goals.filter(g => !g.done).reduce((a, g) => a + Math.max(0, (g.monthly || 0) - goalContribIn(g, mk)), 0);
const goalPlanTotal = () => S.goals.filter(g => !g.done).reduce((a, g) => a + (g.monthly || 0), 0);
const TITHE = "tithing", FAST = "fastoffering";
const titheOn = () => S.settings.tithing !== false;
const titheRate = () => (S.settings.tithePct ?? 10) / 100;
const titheOwed = mk => titheOn() ? Math.round(plannedIncome(mk) * titheRate()) : 0;
const fastAmt = () => S.settings.fastOffering || 0;
const paidTo = (catId, mk) => spentIn(mk, catId);
const givingUnpaid = mk => Math.max(0, titheOwed(mk) - paidTo(TITHE, mk)) + Math.max(0, fastAmt() - paidTo(FAST, mk));
const givingPlanned = mk => titheOwed(mk) + fastAmt();
const budgetOf = (c, mk) => c.id === TITHE && titheOn() ? titheOwed(mk) : c.id === FAST && fastAmt() ? fastAmt() : (c.budget || 0);
function fastSunday(mk) { const [y, m] = mk.split("-").map(Number); const d = new Date(y, m - 1, 1); const add = (7 - d.getDay()) % 7; return `${mk}-${pad(1 + add)}`; }
const allowanceTotal = () => (S.settings.allowance || 0) * Math.max(2, S.members.length);

function safeToSpend(mk) {
  const income = plannedIncome(mk);
  const bills = billsIn(mk);
  const billsAll = bills.reduce((a, b) => a + (b.amount || 0), 0);
  const unpaid = bills.reduce((a, b) => a + (b.remaining || 0), 0);
  const spent = spentIn(mk);
  const start = income - billsAll - goalPlanTotal() - allowanceTotal() - givingPlanned(mk);
  const safe = income - spent - unpaid - goalPlanRemaining(mk) - allowanceTotal() - givingUnpaid(mk);
  return { income, start, safe, spent, unpaid, billsAll };
}

function carryInto(c, mk) {
  if (!c.rollover) return 0;
  const first = c.since || (S.txns.length ? S.txns.reduce((a, t) => t.date && t.date < a ? t.date : a, mk + "-31").slice(0, 7) : mk);
  let carry = 0, m = first, guard = 0;
  while (monthDiff(m, mk) > 0 && guard++ < 36) { carry += budgetOf(c, m) - spentIn(m, c.id); m = addMonths(m, 1); }
  return carry;
}

/* ---------- render scheduling ---------- */
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render() {
  $("#who").textContent = S.members.length > 1 ? S.members.map(m => nameOf(m.id)).join(" & ") : "Waiting for your partner to open this page";

}

/* ---------- views ---------- */
function txnRow(t) {
  const c = catById(t.categoryId);
  const inc = t.type === "income";
  return `<button class="item" type="button" data-txn="${esc(t.id)}">

    <span class="s">${dayLabel(t.date)} · ${inc ? (earnerOf(t) ? "Paid to " + esc(earnerOf(t)) : "Came in") : esc(c ? c.name : "Needs a category")} · ${esc(nameOf(t.by))}</span></span>
    <span class="amt ${inc ? "pos" : ""}">${inc ? "+" : ""}${money(t.amount, true)}</span></button>`;
}

function viewHome() {
  const mk = curMonth();
  const s = safeToSpend(mk);
  const daysLeft = dim(mk) - Number(todayStr().slice(8)) + 1;
  const perDay = s.safe > 0 ? Math.floor(s.safe / daysLeft) : 0;
  const today = todayStr();
  const upcoming = billsIn(mk).filter(b => !b.paid).slice(0, 5);
  const recent = [...S.txns].sort((a, b) => (b.date + (b.ts || 0)).localeCompare(a.date + (a.ts || 0))).slice(0, 8);
  const funLeft = (S.settings.allowance || 0) - S.fun.filter(f => f.date && mkey(f.date) === mk).reduce((a, f) => a + f.amount, 0);
  const noSetup = !incomeIn(mk);
  const unsorted = unsortedTxns();
  // traffic light: compare what's left with how much of the month is left
  const st = noSetup ? null : s.safe < 0 ? ["stop", "🔴", "Stop spending — we're over"] : s.safe < s.income * .15 ? ["slow", "🟡", "Slow down a little"] : ["good", "🟢", "We're doing fine"];
  const paysIn = incomeList(mk);
  const cameIn = incomeIn(mk), usual = S.settings.expectedIncome || 0;

  return `
  <div class="hero">
    <div class="hero-text">
      <div class="eyebrow">Left to spend in ${esc(monthName(mk).split(" ")[0])}</div>
      <div class="big ${s.safe < 0 ? "over" : ""}">${money(s.safe)}</div>
      ${st ? `<div class="status ${st[0]}"><span aria-hidden="true">${st[1]}</span>${st[2]}</div>` : ""}
      <div class="hero-sub">${noSetup
        ? `No pay logged yet this month. Tap <b>We got paid</b> when a paycheck comes in.`
        : s.safe < 0 ? `Spending, bills still due and tithing add up to <b>${money(-s.safe)}</b> more than what's come in so far.`
        : `That's about <b>${money(perDay)} a day</b> for the ${daysLeft} day${daysLeft > 1 ? "s" : ""} left.`}</div>
      <div class="mini-stats">
        <div><span>Came in</span>${money(cameIn)}${usual ? ` <small class="muted">of usual ${money(usual)}</small>` : ""}</div>
        <div><span>Spent</span>${money(s.spent)}</div>
        <div><span>Bills to pay</span>${money(s.unpaid)}</div>
      </div>
      <div class="quick">
        <button class="qbtn spend" type="button" id="spendBtn"><span class="ic" aria-hidden="true">🧾</span>I spent money</button>
        <button class="qbtn paid" type="button" id="paidBtn"><span class="ic" aria-hidden="true">💵</span>We got paid</button>
      </div>
    </div>
    <div class="jarbox"><canvas id="jar" aria-label="Jar showing ${money(s.safe)} left to spend"></canvas></div>
  </div>

  ${unsorted.length ? `<section><div class="sortcard"><span style="font-size:26px" aria-hidden="true">🏷️</span><div class="main">${unsorted.length} purchase${unsorted.length > 1 ? "s" : ""} still need${unsorted.length > 1 ? "" : "s"} a category</div>
    <button class="btn sm" type="button" id="sortBtn">Sort ${unsorted.length > 1 ? "them" : "it"}</button></div></section>` : ""}

  ${S.settings.allowance ? `<section><div class="fun"><div class="main"><div class="eyebrow">Your fun money · private</div>
    <div style="font-family:var(--f-display);font-size:22px;font-weight:700;margin-top:2px" class="${funLeft < 0 ? "neg" : ""}">${money(funLeft)} <span class="muted" style="font-family:var(--f-body);font-size:13px;font-weight:500">left of ${money(S.settings.allowance)}</span></div>
    <div class="muted" style="font-size:12.5px">Only you see what you spend here.</div></div>
    <button class="btn sm" type="button" id="funBtn">Log</button></div></section>` : ""}

  ${payListSection(mk, paysIn, true)}

  ${givingCard(mk)}

  <section><div class="sec-h"><h2>Coming up</h2><button class="link" type="button" data-go="bills">All bills</button></div>
    <div class="list">${upcoming.length ? upcoming.map(b => {
      const overdue = b.dueDate < today;
      return `<div class="item"><span class="dot" style="background:${overdue ? "var(--over)" : "var(--gold)"}"></span>

        <span class="amt">${money(b.remaining, true)}${b.split && b.partSum ? `<small class="muted" style="display:block;font-weight:500;font-size:12px;text-align:right">left</small>` : ""}</span><button class="btn sm ghost" type="button" data-pay="${esc(b.id)}">${b.split ? "Add part" : "Paid"}</button></div>`;
    }).join("") : `<div class="empty"><b>Nothing due</b>${S.bills.length ? "Every bill this month is paid." : "Add bills that repeat (rent, power, phone) on the Bills tab."}</div>`}</div></section>

function incomeList(mk) { return txnsIn(mk).filter(t => t.type === "income").sort((a, b) => (b.date + (b.ts || 0)).localeCompare(a.date + (a.ts || 0))); }
function payListSection(mk, list, home) {
  const total = list.reduce((a, t) => a + t.amount, 0);
  const byWho = {}; list.forEach(t => { const w = earnerOf(t) || "Not set"; byWho[w] = (byWho[w] || 0) + t.amount; });
  const split = Object.entries(byWho).map(([w, v]) => `${esc(w)} ${money(v)}`).join(" · ");
  return `<section><div class="sec-h"><h2>Money that came in · ${esc(monthName(mk, true))}</h2><span class="amt pos">${money(total)}</span></div>
    ${list.length > 1 ? `<p class="muted" style="font-size:14px;margin:0 0 8px">${split}</p>` : ""}
    <div class="list">${list.length ? list.map(t => {
      const who = earnerOf(t);
      return `<button class="item" type="button" data-txn="${esc(t.id)}"><span style="font-size:24px;line-height:1;flex:none;width:30px;text-align:center" aria-hidden="true">${kindOf(t.source).slice(-1)[0]}</span>
        <span class="main"><span class="t">${esc(dayLabel(t.date))} · ${who ? `Paid to ${esc(who)}` : `<span style="color:var(--warn)">Who? Tap to set</span>`}</span>
        <span class="s">${esc(t.source ? kindOf(t.source)[1] : (t.payee || "Money in"))} · added by ${esc(nameOf(t.by))}</span></span>
        <span class="amt pos">+${money(t.amount, true)}</span></button>`; }).join("")
      : `<div class="empty"><b>Nothing yet</b>${home ? "Tap <b style=\"display:inline\">We got paid</b> each time a paycheck, overtime, commission or side money comes in." : "No pay logged this month."}</div>`}</div></section>`;
}
function givingCard(mk) {
  if (!titheOn() && !fastAmt()) return "";
  const owed = titheOwed(mk), tPaid = paidTo(TITHE, mk), fPaid = paidTo(FAST, mk), fs = fastSunday(mk);
  const y = mk.slice(0, 4);
  const ytdInc = S.txns.filter(t => t.type === "income" && t.date && t.date.startsWith(y)).reduce((a, t) => a + t.amount, 0);
  const ytdTithe = S.txns.filter(t => t.type !== "income" && t.categoryId === TITHE && t.date && t.date.startsWith(y)).reduce((a, t) => a + t.amount, 0);
  const ytdFast = S.txns.filter(t => t.type !== "income" && t.categoryId === FAST && t.date && t.date.startsWith(y)).reduce((a, t) => a + t.amount, 0);
  const row = (label, sub, paid, due, cat, payee) => {
    const pct = due > 0 ? clamp(paid / due, 0, 1) : 0, done = due > 0 && paid >= due;
    return `<div class="cat" style="cursor:default"><span class="nm">${label}</span>
      <span class="lf">${done ? `<span class="chip ok">Paid ✓</span>` : `<button class="btn sm gold" type="button" data-give="${cat}" data-amt="${Math.max(0, due - paid)}" data-payee="${esc(payee)}">Pay ${money(Math.max(0, due - paid), true)}</button>`}</span>

  };

function viewBudget() {
  const mk = S.month;
  const mode = "category";
  const groups = [["fixed", "Same every month"], ["flex", "Changes month to month"], ["nonmonthly", "Saving up for"]];
  const catRow = c => {
    const spent = spentIn(mk, c.id);
    const bud = budgetOf(c, mk);
    const avail = bud + carryInto(c, mk) - spent;
    const base = bud + Math.max(0, carryInto(c, mk));
    const pct = base > 0 ? clamp(spent / base, 0, 1) : spent > 0 ? 1 : 0;
    const cls = avail < 0 ? "over" : pct > .85 ? "warn" : "";
    const carry = carryInto(c, mk);
    return `<button class="cat" type="button" data-cat="${esc(c.id)}"><span class="nm">${esc(c.name)}</span>
      <span class="lf ${avail < 0 ? "neg" : ""}">${money(avail)} ${avail < 0 ? "over" : "left"}</span>
      <span class="bar"><i class="${cls}" style="width:${(pct * 100).toFixed(1)}%"></i></span>
      <span class="meta">${money(spent)} of ${money(bud)}${c.id === TITHE && titheOn() ? ` · ${Math.round(titheRate() * 100)}% of income` : ""}${c.id === FAST && fastAmt() ? " · from Settings" : ""}${c.rollover ? ` · rollover ${carry >= 0 ? "+" : ""}${money(carry)}` : ""}</span></button>`;
  };
  const sortCats = list => [...list].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.name.localeCompare(b.name));
  const uncSpent = txnsIn(mk).filter(t => t.type !== "income" && !catById(t.categoryId)).reduce((a, t) => a + t.amount, 0);

  let body = "";
  if (!S.cats.length) {
    body = `<div class="list"><div class="empty"><b>No categories yet</b>Add categories like Groceries or Mortgage, then give each a monthly amount.<div style="margin-top:12px"><button class="btn sm gold" type="button" id="addCat">Add a category</button></div></div></div>`;
  } else if (mode === "flex") {
    const fixedB = S.cats.filter(c => c.group === "fixed").reduce((a, c) => a + budgetOf(c, mk), 0);
    const nonB = S.cats.filter(c => c.group === "nonmonthly").reduce((a, c) => a + budgetOf(c, mk), 0);
    const flexNumber = plannedIncome(mk) - fixedB - nonB - goalPlanTotal() - allowanceTotal();
    const flexSpent = txnsIn(mk).filter(t => t.type !== "income" && (!catById(t.categoryId) || catById(t.categoryId).group === "flex")).reduce((a, t) => a + t.amount, 0);
    const left = flexNumber - flexSpent;
    const pct = flexNumber > 0 ? clamp(flexSpent / flexNumber, 0, 1) : 1;
    body = `<div class="flexcard"><div class="eyebrow">Flex number · everything that isn't a fixed bill</div>
      <div class="big ${left < 0 ? "over" : ""}">${money(left)} <span class="muted" style="font-family:var(--f-body);font-size:15px;font-weight:500;letter-spacing:0">left of ${money(flexNumber)}</span></div>
      <div class="bar" style="height:12px"><i class="${left < 0 ? "over" : pct > .85 ? "warn" : ""}" style="width:${(pct * 100).toFixed(1)}%"></i></div>
      <div class="muted" style="font-size:12.5px;margin-top:8px">Income ${money(plannedIncome(mk))} − fixed incl. tithing &amp; offerings ${money(fixedB)} − non-monthly set-asides ${money(nonB)} − goals ${money(goalPlanTotal())} − fun money ${money(allowanceTotal())}</div></div>
      <div class="list">${groups.map(([g, label]) => {

        return `<div class="group-h"><span>${label}</span><span>${money(cs.reduce((a, c) => a + spentIn(mk, c.id), 0))} spent</span></div>${cs.map(catRow).join("")}`;

  } else {

    body = `<div class="flexcard row between" style="flex-wrap:wrap">

        <div class="muted" style="font-size:12.5px;max-width:26em">Pay that has actually come in (${money(plannedIncome(mk))}) minus every category budget, goal and fun money. Below $0 means more is planned than has come in so far.</div></div>
      <div class="list">${groups.map(([g, label]) => {
        const cs = sortCats(S.cats.filter(c => (c.group || "flex") === g));
        if (!cs.length) return "";
        return `<div class="group-h"><span>${label}</span><span>${money(cs.reduce((a, c) => a + budgetOf(c, mk), 0))} budgeted</span></div>${cs.map(catRow).join("")}`;

    <div class="list" style="padding:6px 0">${rows.length ? rows.map(([k, v]) => `<div style="display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:10px;align-items:center;padding:6px 14px;font-size:13.5px">

    ${S.goals.length ? `<div class="goals">${S.goals.map(g => {
      const pay = g.kind === "payoff";
      const prog = pay ? ((g.start || 0) - (g.remaining || 0)) : (g.saved || 0);
      const tgt = pay ? (g.start || 0) : (g.target || 0);

function nwChart() {
  const end = curMonth();
  const months = []; for (let i = 11; i >= 0; i--) months.push(addMonths(end, -i));
  const val = (a, mk) => { if (mk === end) return a.balance || 0; const h = (a.history || []).filter(x => x.m <= mk).sort((x, y) => x.m.localeCompare(y.m)); return h.length ? h[h.length - 1].v : null; };
  const pts = months.map(mk => { let any = false, sum = 0; S.accts.forEach(a => { const v = val(a, mk); if (v !== null) { any = true; sum += a.kind === "liability" ? -v : v; } }); return any ? sum : null; });
  const real = pts.map((v, i) => [i, v]).filter(p => p[1] !== null);
  if (real.length < 2) return `<p class="muted" style="font-size:13px;margin:6px 0 0">The trend line appears after balances are updated in two different months.</p>`;
  const W = 600, H = 150, padL = 8, padR = 8, padT = 12, padB = 22;
  const vs = real.map(p => p[1]); let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo -= 100; hi += 100; }
  const x = i => padL + i / 11 * (W - padL - padR), yv = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const line = real.map((p, k) => `${k ? "L" : "M"}${x(p[0]).toFixed(1)},${yv(p[1]).toFixed(1)}`).join("");
  const area = `${line}L${x(real[real.length - 1][0]).toFixed(1)},${H - padB}L${x(real[0][0]).toFixed(1)},${H - padB}Z`;
  const last = real[real.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Net worth over the last 12 months">
    <defs><linearGradient id="nwg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--water)" stop-opacity=".35"/><stop offset="1" stop-color="var(--water)" stop-opacity="0"/></linearGradient></defs>
    ${[0, .5, 1].map(f => `<line x1="${padL}" x2="${W - padR}" y1="${padT + f * (H - padT - padB)}" y2="${padT + f * (H - padT - padB)}" stroke="var(--line)" stroke-width="1"/>`).join("")}
    <path d="${area}" fill="url(#nwg)"/><path d="${line}" fill="none" stroke="var(--water)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last[0])}" cy="${yv(last[1])}" r="4.5" fill="var(--water2)"/>
    <text x="${padL}" y="${H - 6}" fill="var(--muted)" font-size="11">${esc(monthName(months[0], true))}</text>
    <text x="${W - padR}" y="${H - 6}" fill="var(--muted)" font-size="11" text-anchor="end">${esc(monthName(end, true))}</text></svg>`;
}

function drawRings() {
  const cs = getComputedStyle(document.documentElement);
  document.querySelectorAll("canvas[data-ring]").forEach(cv => {
    const p = +cv.dataset.ring, ctx = cv.getContext("2d"), w = cv.width, r = w / 2 - 8;
    ctx.clearRect(0, 0, w, w);
    ctx.lineWidth = 10; ctx.lineCap = "round";
    ctx.strokeStyle = cs.getPropertyValue("--glass"); ctx.beginPath(); ctx.arc(w / 2, w / 2, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = cs.getPropertyValue(cv.dataset.kind === "payoff" ? "--gold" : "--water");
    if (p > 0) { ctx.beginPath(); ctx.arc(w / 2, w / 2, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); ctx.stroke(); }
    ctx.fillStyle = cs.getPropertyValue("--ink"); ctx.font = `700 22px ${cs.getPropertyValue("--f-body")}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(Math.round(p * 100) + "%", w / 2, w / 2 + 1);
  });
}

/* ---------- the jar (canvas water) ---------- */
const jar = { cv: null, ctx: null, N: 48, h: [], v: [], level: .6, target: .6, pace: null, over: false, bubbles: [], running: false, petals: [{ f: .22, s: 7, rot: .3, drift: .0004 }, { f: .48, s: 5.5, rot: -.5, drift: -.0003 }, { f: .7, s: 6.5, rot: .9, drift: .00035 }, { f: .86, s: 4.5, rot: -.2, drift: -.00025 }], colors: {}, w: 0, hgt: 0, lastPoke: 0, ro: null };
function jarColors() { const cs = getComputedStyle(document.documentElement); ["--water", "--water2", "--over", "--line", "--muted", "--ink", "--glass", "--gold", "--surface"].forEach(k => jar.colors[k] = cs.getPropertyValue(k).trim()); }
function mountJar() {
  const cv = $("#jar"); if (!cv) return;
  const fresh = jar.cv !== cv; jar.cv = cv; jar.ctx = cv.getContext("2d");
  if (!jar.h.length) for (let i = 0; i < jar.N; i++) { jar.h.push(0); jar.v.push(0); }
  const s = safeToSpend(curMonth());
  const start = Math.max(1, s.income);
  const nt = s.safe <= 0 ? .04 : clamp(s.safe / start, .06, 1);
  if (jar.inited && Math.abs(nt - jar.target) > .002) splash(.5, (jar.target - nt) * 60);
  jar.inited = true;
  jar.target = nt; jar.over = s.safe < 0;
  const d = dim(curMonth()), day = Number(todayStr().slice(8));
  jar.pace = null;
  if (fresh) {
    jarColors(); sizeJar();
    if (jar.ro) jar.ro.disconnect(); jar.ro = new ResizeObserver(sizeJar); jar.ro.observe(cv);
    cv.addEventListener("pointermove", e => poke(e, false)); cv.addEventListener("pointerdown", e => poke(e, true));
  }
  if (!jar.running) { jar.running = true; requestAnimationFrame(tick); }
}
function unmountJar() { jar.running = false; jar.cv = null; if (jar.ro) { jar.ro.disconnect(); jar.ro = null; } }
function sizeJar() { if (!jar.cv) return; const r = jar.cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); jar.w = r.width; jar.hgt = r.height; jar.cv.width = Math.round(r.width * dpr); jar.cv.height = Math.round(r.height * dpr); jar.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); if (reduceMotion) draw(); }
function jarRect() { const W = jar.w, H = jar.hgt, jw = Math.min(W - 24, 300), x = (W - jw) / 2; return { x, y: 26, w: jw, h: H - 34 }; }
function splash(fx, force) { const i = clamp(Math.round(fx * (jar.N - 1)), 0, jar.N - 1); for (let k = -2; k <= 2; k++) { const j = i + k; if (j >= 0 && j < jar.N) jar.v[j] += force * (1 - Math.abs(k) * .3); } }
function poke(e, hard) {
  if (reduceMotion) return;
  const r = jar.cv.getBoundingClientRect(), R = jarRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (x < R.x || x > R.x + R.w) return;
  const surf = R.y + (1 - jar.level) * R.h;
  if (!hard && Math.abs(y - surf) > 34) return;
  const now = performance.now(); if (!hard && now - jar.lastPoke < 30) return; jar.lastPoke = now;
  splash((x - R.x) / R.w, hard ? 9 : clamp(e.movementY || 2, -5, 5) * .9);
  if (hard) for (let i = 0; i < 6; i++) jar.bubbles.push({ x: x + (Math.random() - .5) * 20, y: Math.max(surf + 10, y), r: 1.5 + Math.random() * 3, s: .4 + Math.random() * .8 });
}
function tick() {
  if (!jar.running || !jar.cv) return;
  if (!reduceMotion) {
    const { h, v, N } = jar;
    for (let i = 0; i < N; i++) { v[i] += -0.025 * h[i] - 0.03 * v[i]; h[i] += v[i]; }
    for (let p = 0; p < 2; p++) {

}
function closeSheet() { $("#sheetRoot").innerHTML = ""; sheetState = null; }

const chipsHtml = (name, opts, sel) => `<div class="chips" data-chips="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === sel}">${esc(l)}</button>`).join("")}</div>`;

/* ---------- quick entry: amount → one tap → saved ---------- */
const unsortedTxns = () => S.txns.filter(t => t.type !== "income" && !catById(t.categoryId) && !t.billId).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
function quickCats() {
  // the everyday spending categories, most-used first
  const since = addMonths(curMonth(), -3), use = {};
  S.txns.forEach(t => { if (t.categoryId && t.date >= since) use[t.categoryId] = (use[t.categoryId] || 0) + 1; });
  const flex = S.cats.filter(c => (c.group || "flex") === "flex");
  const pool = flex.length ? flex : S.cats;
  return [...pool].sort((a, b) => (use[b.id] || 0) - (use[a.id] || 0) || (a.order ?? 99) - (b.order ?? 99) || a.name.localeCompare(b.name)).slice(0, 7);
}
const sortedCats = () => [...S.cats].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.name.localeCompare(b.name));
const bigCatBtn = c => `<button class="bigcat" type="button" data-pick="${esc(c.id)}"><span class="ic" aria-hidden="true">${iconOf(c)}</span>${esc(c.name)}</button>`;
const unsureBtn = label => `<button class="bigcat unsure" type="button" data-pick=""><span class="ic" aria-hidden="true">❓</span>${label}</button>`;
function catPickerHtml(showAll) {
  const quick = quickCats(), rest = sortedCats().filter(c => !quick.includes(c));
  return `<div class="bigcats">${quick.map(bigCatBtn).join("")}${unsureBtn("Not sure")}</div>
    ${rest.length ? (showAll ? `<div class="lbl" style="margin:16px 0 8px">Everything else</div><div class="bigcats">${rest.map(bigCatBtn).join("")}</div>`

}

function quickEntry(kind) {
  const inc = kind === "income";
  const st = { amt: "", date: todayStr(), payee: "", note: "", step: 1, showAll: false, extra: false, kind: "pay" };
  const shown = () => st.amt ? "$" + (st.amt.includes(".") ? (() => { const [w, d] = st.amt.split("."); return Number(w || 0).toLocaleString() + "." + d; })() : Number(st.amt).toLocaleString()) : "$0";
  const cents = () => parseMoney(st.amt || "0");
  const press = k => {
    if (k === "back") st.amt = st.amt.slice(0, -1);
    else if (k === ".") { if (!st.amt.includes(".")) st.amt = (st.amt || "0") + "."; }
    else { const [w, d] = st.amt.split("."); if (d !== undefined ? d.length < 2 : (w || "").length < 7) st.amt = st.amt === "0" ? k : st.amt + k; }
    const a = $(".pad-amt"); if (a) { a.textContent = shown(); a.classList.toggle("empty", !st.amt); }
    const n = $("#qe-next"); if (n) n.disabled = !(cents() > 0);
  };
  const keep = () => { const d = $("#qe-date"); if (d) { st.date = d.value || todayStr(); st.payee = $("#qe-payee").value.trim(); st.note = $("#qe-note").value.trim(); } };
  const step1 = () => `
    <div class="step-h">${inc ? "How much came in?" : "How much did you spend?"}</div>
    <div class="pad-amt ${st.amt ? "" : "empty"}" aria-live="polite">${shown()}</div>
    <div class="pad-sub">${st.date === todayStr() ? "Today" : dayLabel(st.date)}${st.payee ? " · " + esc(st.payee) : ""}</div>
    <div class="keys">${["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0"].map(k => `<button type="button" data-k="${k}">${k}</button>`).join("")}<button type="button" data-k="back" aria-label="Delete last number">⌫</button></div>
    <button class="btn gold wide" type="button" id="qe-next" ${cents() > 0 ? "" : "disabled"} style="${inc ? "background:var(--ok);color:#fff" : ""}">Next</button>
    ${st.extra ? `<div class="extra"><div class="two"><div class="field"><label for="qe-date">Date</label><input id="qe-date" type="date" value="${esc(st.date)}"></div>
      <div class="field"><label for="qe-payee">${inc ? "From" : "Where"}</label><input id="qe-payee" value="${esc(st.payee)}" placeholder="${inc ? "Optional" : "Costco"}" autocomplete="off"></div></div>
      <div class="field"><label for="qe-note">Note</label><input id="qe-note" value="${esc(st.note)}" placeholder="Optional" autocomplete="off"></div></div>`
      : `<button class="link more-link" type="button" id="qe-extra">Different day, or add where / a note</button>`}
    <button class="btn ghost wide" type="button" data-close>Cancel</button>`;
  const step2 = () => inc ? `
    <div class="step-h">Who got paid ${money(cents(), true)}?</div>
    <div class="pad-sub">${st.date === todayStr() ? "Today" : dayLabel(st.date)} · change the kind below if it isn't a paycheck</div>
    <div class="chips" data-chips="kind" style="justify-content:center;margin-bottom:14px">${PAY_KINDS.map(([v, l, ic]) => `<button type="button" data-v="${v}" aria-pressed="${v === st.kind}">${ic} ${l}</button>`).join("")}</div>
    <div class="bigcats">${earners().map(e => `<button class="bigcat" type="button" data-who="${esc(e.name)}"><span class="ic" aria-hidden="true">🙋</span>${esc(e.name)}</button>`).join("")}</div>
    <button class="btn ghost wide" type="button" data-who="${BOTH}">${BOTH} / family</button>
    <div class="backrow"><button class="btn ghost" type="button" id="qe-back">‹ Back</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`
    : `
    <div class="step-h">What was ${money(cents(), true)} for?</div><div class="pad-sub">Tap one and you're done.</div>
    ${S.cats.length ? catPickerHtml(st.showAll) : `<div class="bigcats">${unsureBtn("Save it for now")}</div>`}
    <div class="backrow"><button class="btn ghost" type="button" id="qe-back">‹ Back</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`;
  const finish = async data => {
    const id = uidGen();
    Object.assign(data, { amount: cents(), date: st.date || todayStr(), note: st.note, whose: "ours", by: S.uid, ts: Date.now() });
    closeSheet();
    const ok = await save(() => store.set("txns", id, data));
    if (!ok) return;
    let msg;
    if (inc) { const tithe = titheOn() ? Math.round(data.amount * titheRate()) : 0; msg = `✓ ${money(data.amount, true)} to ${data.earner}, ${dayLabel(data.date)}${tithe ? ` · tithing: ${money(tithe, true)}` : ""}`; }
    else { const c = catById(data.categoryId); msg = `✓ ${money(data.amount, true)} saved${c ? " · " + c.name : ""}`; }
    toast(msg, () => save(() => store.del("txns", id), "Removed"));
  };
  const draw = () => {
    const sh = $(".sheet"); if (!sh) return;

    sh.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
    if (st.step === 1) {
      sh.querySelectorAll("[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
      const ex = $("#qe-extra"); if (ex) ex.onclick = () => { st.extra = true; draw(); };

    } else {

      const all = sh.querySelector("[data-allcats]"); if (all) all.onclick = () => { st.showAll = true; draw(); };
      sh.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => finish({ type: "expense", categoryId: b.dataset.pick || null, payee: st.payee }));
      const kc = sh.querySelector('[data-chips="kind"]');

        payee: st.payee || payLabel(b.dataset.who, st.kind) }));

  openSheet("", null, null);
  draw();

    if (/^[0-9.]$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("back"); else if (e.key === "Enter") { const n = $("#qe-next"); if (n && !n.disabled) n.click(); }

}
document.addEventListener("keydown", e => quickEntry.keys && quickEntry.keys(e));

  };

}

/* delete with an Undo instead of "are you sure?" */
async function deleteTxn(t) {
  const { id, ...data } = t;
  closeSheet();
  const pb = t.billId && S.bills.find(x => x.id === t.billId);
  const partMonth = pb && pb.parts ? Object.keys(pb.parts).find(m => (pb.parts[m] || []).includes(id)) : null;
  if (t.billId) {
    const b = S.bills.find(x => x.id === t.billId); const mk = mkey(t.date);
    if (b && b.paid && b.paid[mk] === id) { const p = { ...b.paid }; delete p[mk]; await save(() => store.update("bills", b.id, { paid: p })); }
    if (b && b.parts) { const parts = {}; Object.entries(b.parts).forEach(([m, ids]) => { parts[m] = ids.filter(x => x !== id); }); await save(() => store.update("bills", b.id, { parts })); }
  }
  if (await save(() => store.del("txns", id))) toast("Deleted", async () => {
    await save(() => store.set("txns", id, data), "Brought back");
    if (t.billId) { const b = S.bills.find(x => x.id === t.billId); const m = partMonth || mkey(t.date);
      if (b && b.split) { const parts = { ...(b.parts || {}) }; parts[m] = [...(parts[m] || []), id]; await save(() => store.update("bills", b.id, { parts })); }
      else if (b) await save(() => store.update("bills", b.id, { paid: { ...(b.paid || {}), [m]: id } })); }
  });
}

function billMonthSheet(id, mk) {

  const plusDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  const today = todayStr(), yest = plusDays(today, -1);
  const first = `${mk}-01`, last = `${mk}-${pad(dim(mk))}`;
  const amt = (b.paid ? b.paidAmt : b.amount) / 100;
  openSheet(`<div class="step-h">${esc(b.name)}</div><div class="pad-sub">${esc(monthName(mk))}</div>
    <form id="bmf" novalidate>

      ${b.paid ? `
        <div class="field"><label for="bm-paid">Paid on</label><input id="bm-paid" type="date" value="${esc(b.paidDate || today)}"></div>
        <p class="err" id="bm-err"></p>
        <button class="btn gold wide" type="submit">Save</button>
        <button class="link more-link" type="button" id="bm-unpay" style="color:var(--over)">It wasn't paid. Undo "paid"</button>`
      : `
        <span class="lbl">When was it paid?</span>
        <div class="bigcats" style="margin-top:8px">
          <button class="bigcat" type="button" data-when="${today}"><span class="ic" aria-hidden="true">✅</span>Today</button>
          <button class="bigcat" type="button" data-when="${yest}"><span class="ic" aria-hidden="true">↩️</span>Yesterday</button></div>
        <div class="field" style="margin-top:12px"><label for="bm-paid">Or pick the day</label><input id="bm-paid" type="date" value=""></div>
        <p class="err" id="bm-err"></p>
        <button class="btn gold wide" type="submit">Save</button>`}
      ${b.paid ? "" : `<button class="link more-link" type="button" id="bm-split">Paid in parts, like Flex rent? Switch this bill to split payments</button>`}
      <div class="backrow"><button class="link" type="button" id="bm-edit">Change name, usual amount or usual day</button><button class="btn ghost" type="button" data-close>Close</button></div>
    </form>`, root => {
      root.querySelector("[data-close]").onclick = closeSheet;
      const sp = $("#bm-split"); if (sp) sp.onclick = async () => { if (await save(() => store.update("bills", id, { split: true }))) setTimeout(() => splitSheet(id, mk), 150); };
      $("#bm-edit").onclick = () => billSheet(S.bills.find(x => x.id === id));
      const fresh = () => S.bills.find(x => x.id === id) || b;
      const saveDue = async () => {
        const due = $("#bm-due").value;
        if (!due || due === b.dueDate) return true;
        const dueOn = { ...(fresh().dueOn || {}) };
        if (due === `${mk}-${pad(Math.min(b.dueDay || 1, dim(mk)))}`) delete dueOn[mk]; else dueOn[mk] = due;
        return save(() => store.update("bills", id, { dueOn }));
      };
      const amount = () => { const v = parseMoney($("#bm-amt").value); return v > 0 ? v : 0; };
      const markPaid = async date => {

      $("#bmf").onsubmit = async e => {

          return;
        }
        const d = $("#bm-paid").value || b.paidDate || today;
        if (!amount()) { $("#bm-err").textContent = "Type the amount above $0."; return; }
        if (!(await saveDue())) return;
        const tid = fresh().paid && fresh().paid[mk];
        const ok = tid && S.txns.find(t => t.id === tid)
          ? await save(() => store.update("txns", tid, { date: d, amount: amount() }))
          : await save(async () => { const nt = uidGen(); await store.set("txns", nt, { type: "expense", amount: amount(), payee: b.name, date: d, categoryId: b.categoryId || null, whose: "ours", by: S.uid, ts: Date.now(), billId: id, note: "" }); await store.update("bills", id, { paid: { ...(fresh().paid || {}), [mk]: nt } }); });
        if (ok) { closeSheet(); toast(`✓ Saved · paid ${dayLabel(d)}`); }
      };
    });
}

}
function splitSheet(id, mk) {

          <button class="btn sm ghost" type="button" data-fixpart="${esc(t.id)}">Fix</button></div>`).join("")}</div>` : `<p class="muted" style="margin:10px 0 0;font-size:14.5px">No parts taken yet this month.</p>`}
      </div>
      ${b.paid ? "" : `<div class="lbl">Add a part</div>
      <div class="field" style="margin-top:6px"><label for="sp-amt">How much was taken</label><input class="money-in" id="sp-amt" inputmode="decimal" value="${b.remaining ? (b.remaining / 100).toFixed(2) : ""}" placeholder="$0.00"></div>
      <span class="lbl">When was it taken?</span>
      <div class="bigcats" style="margin-top:8px"><button class="bigcat" type="button" data-pwhen="${today}"><span class="ic" aria-hidden="true">✅</span>Today</button>
        <button class="bigcat" type="button" data-pwhen="${yest}"><span class="ic" aria-hidden="true">↩️</span>Yesterday</button></div>
      <div class="row" style="margin-top:10px"><input id="sp-date" type="date" style="flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px"><button class="btn gold" type="button" id="sp-add">Add on this day</button></div>`}

          <div class="field"><label for="sp-due">Due date</label><input id="sp-due" type="date" min="${first}" max="${last}" value="${esc(b.dueDate)}"></div></div>
        <button class="btn ghost" type="button" id="sp-savemonth">Save</button></details>

    const add = async date => {
      const a = parseMoney($("#sp-amt").value);
      if (!(a > 0)) { $("#sp-err").textContent = "Type how much was taken."; return; }
      if (!date) { $("#sp-err").textContent = "Pick the day it was taken."; return; }
      if (await addBillPart(id, mk, date, a)) { toast(`✓ ${money(a, true)} part added · ${dayLabel(date)}`); setTimeout(redraw, 120); }
    };
    root.querySelectorAll("[data-pwhen]").forEach(x => x.onclick = () => add(x.dataset.pwhen));
    const ad = $("#sp-add"); if (ad) ad.onclick = () => add($("#sp-date").value);
    $("#sp-savemonth").onclick = async () => {
      const b = S.bills.find(x => x.id === id); if (!b) return;

}
async function unpayBill(id, mk) {
  const b = S.bills.find(x => x.id === id); if (!b) return;
  if (b.split) {
    const ids = (b.parts && b.parts[mk]) || []; const parts = { ...(b.parts || {}) }; delete parts[mk];
    await save(async () => { await store.update("bills", id, { parts }); for (const t of ids) if (S.txns.find(x => x.id === t)) await store.del("txns", t); }, "Parts cleared");
    return;
  }
  const tid = b.paid && b.paid[mk]; const p = { ...(b.paid || {}) }; delete p[mk];
  await save(async () => { await store.update("bills", id, { paid: p }); if (tid && S.txns.find(t => t.id === tid)) await store.del("txns", tid); }, "Marked unpaid");
}

          const p = { log: [...(g.log || []), { d: todayStr(), amt: a, by: S.uid }] };
          if (g.kind === "payoff") p.remaining = Math.max(0, (g.remaining || 0) - a); else p.saved = (g.saved || 0) + a;
          if (await save(() => store.update("goals", g.id, p), `${money(a)} added`)) closeSheet();
        };
      }
      $("#gf").onsubmit = async e => {
        e.preventDefault(); const name = $("#g-name").value.trim(); if (!name) { $("#g-err").textContent = "Give the goal a name."; return; }
        const k = kind(), data = { name, kind: k, monthly: num("#g-monthly") };
        if (k === "payoff") { data.start = num("#g-start"); data.remaining = $("#g-rem").value.trim() ? num("#g-rem") : data.start; if (!(data.start > 0)) { $("#g-err").textContent = "Enter the starting balance."; return; } }
        else { data.target = num("#g-target"); data.saved = num("#g-saved"); if (!(data.target > 0)) { $("#g-err").textContent = "Enter a target above $0."; return; } }
        if (Object.values(data).some(v => typeof v === "number" && isNaN(v))) { $("#g-err").textContent = "Amounts must be numbers."; return; }
        if (await save(() => edit ? store.update("goals", g.id, data) : store.set("goals", uidGen(), { ...data, log: [] }), "Saved")) closeSheet();
      };
    });
}

function acctSheet(a) {
  const edit = !!a; a = a || { kind: "asset" };
  openSheet(`<h3>${edit ? "Update balance" : "New account"}</h3><form id="af" novalidate>
    <div class="field"><label for="a-name">Name</label><input id="a-name" value="${esc(a.name || "")}" placeholder="Joint checking" autocomplete="off"></div>
    <div class="field">${chipsHtml("kind", [["asset", "Something we own"], ["liability", "Something we owe"]], a.kind)}</div>
    <div class="field"><label for="a-bal">Current balance</label><input class="money-in" id="a-bal" inputmode="decimal" value="${a.balance ? (a.balance / 100).toFixed(2) : ""}" placeholder="$0.00"></div>
    <p class="err" id="a-err"></p>
    <div class="actions">${edit ? `<button class="btn danger" type="button" id="a-del">Delete</button><span class="spacer"></span>` : ""}<button class="btn ghost" type="button" data-close>Cancel</button><button class="btn gold" type="submit">Save</button></div></form>`, root => {
      wireChips(root); root.querySelector("[data-close]").onclick = closeSheet;

      $("#af").onsubmit = async e => {
        e.preventDefault(); const name = $("#a-name").value.trim(), bal = parseMoney($("#a-bal").value);
        if (!name) { $("#a-err").textContent = "Give the account a name."; return; }

        const mk = curMonth(); const hist = (a.history || []).filter(h => h.m !== mk).concat([{ m: mk, v: bal }]).sort((x, y) => x.m.localeCompare(y.m)).slice(-36);
        const data = { name, kind: chipVal(root, "kind") || "asset", balance: bal, history: hist, updated: todayStr() };
        if (await save(() => edit ? store.update("accts", a.id, data) : store.set("accts", uidGen(), data), "Saved")) closeSheet();

    });
}

function funSheet() {
  const mk = curMonth();
  const list = S.fun.filter(f => f.date && mkey(f.date) === mk).sort((a, b) => b.date.localeCompare(a.date));
  openSheet(`<h3>Fun money</h3><p class="muted" style="margin:-8px 0 12px;font-size:13.5px">Private to you. Your partner only knows the monthly amount, not what you spend it on.</p>
    <form id="ff" novalidate><div class="two"><div class="field"><label for="f-amt">Amount</label><input id="f-amt" inputmode="decimal" placeholder="$0.00"></div>
      <div class="field"><label for="f-note">What</label><input id="f-note" placeholder="Optional" autocomplete="off"></div></div>

    <div class="list" style="margin-top:12px">${list.length ? list.map(f => `<div class="item"><span class="main"><span class="t">${esc(f.note || "Fun")}</span><span class="s">${dayLabel(f.date)}</span></span><span class="amt">${money(f.amount, true)}</span><button class="link" type="button" data-fdel="${esc(f.id)}" style="color:var(--over)">Remove</button></div>`).join("") : `<div class="empty">Nothing logged in ${esc(monthName(mk, true))}.</div>`}</div>`, root => {
      root.querySelector("[data-close]").onclick = closeSheet;
      root.querySelectorAll("[data-fdel]").forEach(b => b.onclick = async () => { await save(() => store.del(privPath(), b.dataset.fdel), "Removed"); funSheet(); });
      $("#ff").onsubmit = async e => { e.preventDefault(); const a = parseMoney($("#f-amt").value); if (!(a > 0)) { $("#f-err").textContent = "Enter an amount above $0."; return; }
        if (await save(() => store.set(privPath(), uidGen(), { amount: a, note: $("#f-note").value.trim(), date: todayStr() }), "Logged")) funSheet(); };
