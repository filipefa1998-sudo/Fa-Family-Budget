}

function settingsSheet() {
  const s = S.settings; const m = v => v ? (v / 100).toFixed(0) : "";
  openSheet(`<h3>Settings</h3><form id="sf" novalidate>
    <div class="field"><label for="s-name">Your first name</label><input id="s-name" value="${esc(S.names[S.uid] || "")}" placeholder="Shown on the paycheck button" autocomplete="given-name"></div>
    <div class="field"><label for="s-inc">Usual monthly take-home pay (optional, for comparison)</label><input id="s-inc" inputmode="decimal" value="${m(s.expectedIncome)}" placeholder="$7,500">
      <span class="muted" style="font-size:14px">The budget only counts pay you've added with <b>We got paid</b>. This number is only shown next to it as "of usual", so you can see how the month compares.</span></div>
    <div class="field"><label for="s-fun">Fun money, each, per month</label><input id="s-fun" inputmode="decimal" value="${m(s.allowance)}" placeholder="$150"></div>
    <div class="two"><label class="check" style="margin:0 0 12px"><input type="checkbox" id="s-tithe" ${s.tithing !== false ? "checked" : ""}><span>Track tithing</span></label>
      <div class="field"><label for="s-pct">Tithing %</label><input id="s-pct" inputmode="decimal" value="${s.tithePct ?? 10}"></div></div>
    <div class="field"><label for="s-fast">Fast offering per month</label><input id="s-fast" inputmode="decimal" value="${m(s.fastOffering)}" placeholder="$50"></div>
    <p class="err" id="s-err"></p>
    <div class="sortcard" style="margin:4px 0 14px;border-color:var(--over);background:color-mix(in srgb,var(--over) 7%,var(--surface))"><span style="font-size:24px" aria-hidden="true">🔄</span>
      <div class="main">Start over<div class="muted" style="font-weight:500;font-size:14px">Clear the tracker and begin fresh from today.</div></div>
      <button class="btn sm danger" type="button" id="s-reset">Start over</button></div>
    <div class="actions"><button class="link" type="button" id="s-out">Sign out</button><span class="spacer"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn gold" type="submit">Save</button></div></form>`, root => {
      root.querySelector("[data-close]").onclick = closeSheet;
      $("#s-out").onclick = () => { closeSheet(); firebase.auth().signOut(); };
      $("#s-reset").onclick = resetSheet;
      $("#sf").onsubmit = async e => {
        e.preventDefault(); const n = id => { const v = $(id).value.trim(); return v ? parseMoney(v) : 0; };
        const pct = parseFloat($("#s-pct").value);
        if (!(pct >= 0 && pct <= 100)) { $("#s-err").textContent = "Tithing % must be between 0 and 100."; return; }
        const data = { ...S.settings, expectedIncome: n("#s-inc"), allowance: n("#s-fun"), bigPurchase: 0, fastOffering: n("#s-fast"), tithing: $("#s-tithe").checked, tithePct: pct };
        if ([data.expectedIncome, data.allowance, data.bigPurchase, data.fastOffering].some(v => isNaN(v) || v < 0)) { $("#s-err").textContent = "Amounts must be positive numbers."; return; }
        delete data.id;
        const nm = $("#s-name").value.trim();
        if (nm && nm !== S.names[S.uid]) await save(() => store.db.collection("members").doc(S.uid).set({ name: nm }, { merge: true }));
        if (await save(() => store.set("meta", "settings", data), "Settings saved")) closeSheet();
      };
    });
}

/* ---------- start over ---------- */
function downloadBackup() {
  const data = { saved: new Date().toISOString(), settings: S.settings, cats: S.cats, txns: S.txns, bills: S.bills, goals: S.goals, accts: S.accts };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  a.download = `fa-budget-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function batchRun(ops) {
  for (let i = 0; i < ops.length; i += 400) { const b = store.db.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
}
function resetSheet() {
  let mode = "money";
  const draw = () => {
    const sh = $(".sheet"); if (!sh) return;
    sh.innerHTML = `<div class="step-h">Start over from today</div>
      <p class="pad-sub" style="margin-bottom:14px">This changes the tracker for both of you. Pick what to clear:</p>
      <div class="stack" style="gap:10px">
        <button class="bigcat" type="button" data-mode="money" style="min-height:0;padding:14px;align-items:flex-start;text-align:left;${mode === "money" ? "border:2px solid var(--ink)" : ""}">
          <span>🧹 Clear money in &amp; out</span><span class="muted" style="font-weight:500;font-size:14px">Erases every purchase, paycheck and bill payment. Keeps your categories, bills, goals, accounts and settings.</span></button>
        <button class="bigcat" type="button" data-mode="all" style="min-height:0;padding:14px;align-items:flex-start;text-align:left;${mode === "all" ? "border:2px solid var(--over)" : ""}">
          <span>🗑️ Erase everything</span><span class="muted" style="font-weight:500;font-size:14px">Erases all of the above plus bills, goals, accounts and settings. Categories go back to the starter list.</span></button>
      </div>
      <button class="btn ghost wide" type="button" id="rs-backup">⬇️ Download a backup first</button>
      <div class="field" style="margin-top:14px"><label for="rs-type">Type RESET to confirm</label><input id="rs-type" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="RESET"></div>
      <p class="err" id="rs-err"></p>
      <button class="btn wide" type="button" id="rs-go" disabled style="background:var(--over);color:#fff">${mode === "all" ? "Erase everything" : "Clear money in & out"}</button>
      <button class="btn ghost wide" type="button" data-close>Cancel</button>`;
    sh.querySelector("[data-close]").onclick = closeSheet;
    sh.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; draw(); });
    $("#rs-backup").onclick = downloadBackup;
    const typed = $("#rs-type"), go = $("#rs-go");
    typed.oninput = () => { go.disabled = typed.value.trim().toUpperCase() !== "RESET"; };
    go.onclick = async () => {
      go.disabled = true; go.textContent = "Working…";
      const db = store.db, ops = [];
      S.txns.forEach(t => ops.push(b => b.delete(db.collection("txns").doc(t.id))));
      S.fun.forEach(f => ops.push(b => b.delete(db.collection(privPath()).doc(f.id))));
      if (mode === "all") {
        ["bills", "goals", "accts", "cats"].forEach(c => S[c].forEach(x => ops.push(b => b.delete(db.collection(c).doc(x.id)))));
        ops.push(b => b.set(db.collection("meta").doc("settings"), { mode: "category", expectedIncome: 0, allowance: 0, bigPurchase: 0, tithing: true, tithePct: 10, startedOn: todayStr() }));
      } else {
        S.bills.forEach(x => ops.push(b => b.update(db.collection("bills").doc(x.id), { paid: {}, dueOn: {}, parts: {}, amtOn: {} })));
        ops.push(b => b.set(db.collection("meta").doc("settings"), { startedOn: todayStr() }, { merge: true }));
      }
      try {
        await batchRun(ops);
        if (mode === "all") await seedIfEmpty(true);
        closeSheet(); S.tab = "home"; render(); toast("✓ Fresh start. Everything begins today.");
      } catch (e) {
        $("#rs-err").textContent = "That didn't finish. Check your internet and try again."; go.disabled = false; go.textContent = "Try again";
      }
    };
  };
  openSheet("", null, null); draw();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if (d.tab) { S.tab = d.tab; try { localStorage.setItem("ffb-tab", S.tab); } catch (x) {} window.scrollTo(0, 0); render(); return; }
  if (sheetState && el.closest(".sheet")) return;
  if (d.go) { S.tab = d.go; render(); window.scrollTo(0, 0); return; }
  if (d.txn) return txnDetail(d.txn);
  if (d.give) return giveNow(d.give, +d.amt || 0, d.payee);
  if (d.pay || d.bill) return billMonthSheet(d.pay || d.bill, S.tab === "bills" ? S.billMonth : curMonth());
  if (d.unpay) return unpayBill(d.unpay, S.billMonth);
  if (d.cat) return catSheet(catById(d.cat));
  if (d.goal) return goalSheet(S.goals.find(g => g.id === d.goal));
  if (d.acct) return acctSheet(S.accts.find(a => a.id === d.acct));
  if (d.mnav) { S.month = addMonths(S.month, +d.mnav); render(); return; }
  if (d.bnav) { S.billMonth = addMonths(S.billMonth, +d.bnav); render(); return; }
  switch (el.id) {
    case "addBtn": return chooseSheet();
    case "spendBtn": return quickEntry("expense");
    case "paidBtn": return quickEntry("income");
    case "sortBtn": return sortSheet();
    case "settingsBtn": return settingsSheet();
    case "addCat": return catSheet();
    case "addBill": return billSheet();
    case "addGoal": return goalSheet();
    case "addAcct": return acctSheet();
    case "funBtn": return funSheet();
  }
});

/* ---------- sign-in gate ---------- */
const CFG = window.FFB_CONFIG || {};
const allowed = (CFG.householdEmails || []).map(e => e.toLowerCase().trim());
let gateMode = "signin";
function showGate(kind, extra) {
  document.body.classList.add("gated");
  $("#gate").hidden = false; $("#app").hidden = true;
  if (kind === "config") {
    $("#gate").innerHTML = `<div class="gate-card"><div class="brand" style="font-size:22px">Fa Family Budget</div><canvas id="gateJar" width="240" height="200" aria-hidden="true"></canvas>
      <p><b>Firebase isn't set up yet.</b> The Firebase keys in index.html are missing.</p></div>`;
    drawGateJar(); return;
  }
  if (kind === "denied") {
    $("#gate").innerHTML = `<div class="gate-card"><div class="brand" style="font-size:22px">Fa Family Budget</div><canvas id="gateJar" width="240" height="200" aria-hidden="true"></canvas>
      <p><b>${esc(extra || "This account")} isn't on the household list.</b></p>
      <button class="btn gold" type="button" id="signOutBtn">Sign out</button></div>`;
    $("#signOutBtn").onclick = () => firebase.auth().signOut();
    drawGateJar(); return;
  }
  const up = gateMode === "signup";
  $("#gate").innerHTML = `<div class="gate-card"><div class="brand" style="font-size:22px">Fa Family Budget</div>
    <canvas id="gateJar" width="240" height="200" aria-hidden="true"></canvas>
    <form id="loginForm" novalidate style="width:100%;text-align:left">
      <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(gateShow.email || "")}"></div>
      <div class="field"><label for="li-pass">Password</label><input id="li-pass" type="password" autocomplete="${up ? "new-password" : "current-password"}" ${up ? 'placeholder="At least 6 characters"' : ""}></div>
      <p class="err" id="li-err" role="alert">${esc(extra || "")}</p>
      <button class="btn gold" type="submit" id="li-go" style="width:100%">${up ? "Create account" : "Sign in"}</button>
    </form>
    <div class="row" style="gap:16px;flex-wrap:wrap;justify-content:center">
      <button class="link" type="button" id="li-mode">${up ? "I already have an account" : "First time? Create your account"}</button>
      ${up ? "" : `<button class="link" type="button" id="li-forgot">Forgot password</button>`}
    </div></div>`;
  $("#li-mode").onclick = () => { gateShow.email = $("#li-email").value; gateMode = up ? "signin" : "signup"; showGate("signin"); };
  const fg = $("#li-forgot"); if (fg) fg.onclick = resetPassword;
  $("#loginForm").onsubmit = e => { e.preventDefault(); submitLogin(); };
  drawGateJar();
}
const gateShow = { email: "" };
function authMsg(e) {
  return ({
    "auth/invalid-credential": "That email and password don't match. Check them, or tap Forgot password.",
    "auth/wrong-password": "That password isn't right. Try again, or tap Forgot password.",
    "auth/user-not-found": "There's no account for that email yet. Tap “First time? Create your account”.",
    "auth/invalid-email": "Enter a full email address.",
    "auth/missing-password": "Enter your password.",
    "auth/weak-password": "Use a password with at least 6 characters.",
    "auth/email-already-in-use": "That email already has an account. Tap “I already have an account” and sign in.",
    "auth/operation-not-allowed": "Email sign-in is turned off. In Firebase go to Authentication → Sign-in method → Email/Password and turn it on.",
    "auth/too-many-requests": "Too many tries. Wait a few minutes, or reset your password.",
    "auth/network-request-failed": "Couldn't reach the server. Check your connection and try again."
  })[e && e.code] || ((e && e.message) || "Something went wrong. Try again.");
}
async function submitLogin() {
  const email = $("#li-email").value.trim().toLowerCase(), pass = $("#li-pass").value, err = $("#li-err");
  gateShow.email = email;
  if (!email) { err.textContent = "Enter your email."; return; }
  if (allowed.length && !allowed.includes(email)) { err.textContent = "That email isn't one of the two household accounts."; return; }
  if (!pass) { err.textContent = "Enter your password."; return; }
  const go = $("#li-go"); go.disabled = true; go.textContent = gateMode === "signup" ? "Creating…" : "Signing in…"; err.textContent = "";
  try {
    if (gateMode === "signup") await firebase.auth().createUserWithEmailAndPassword(email, pass);
    else await firebase.auth().signInWithEmailAndPassword(email, pass);
    gateMode = "signin";
  } catch (e) {
    err.textContent = authMsg(e); go.disabled = false; go.textContent = gateMode === "signup" ? "Create account" : "Sign in";
  }
}
async function resetPassword() {
  const email = $("#li-email").value.trim().toLowerCase(), err = $("#li-err");
  if (!email) { err.textContent = "Type your email above first, then tap Forgot password."; return; }
  try { await firebase.auth().sendPasswordResetEmail(email); err.style.color = "var(--ok)"; err.textContent = `Reset link sent to ${email}. Check your inbox (and spam).`; }
  catch (e) { err.textContent = authMsg(e); }
}
function hideGate() { document.body.classList.remove("gated"); $("#gate").hidden = true; $("#app").hidden = false; }
function drawGateJar() {
  const cv = $("#gateJar"); if (!cv) return; const ctx = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const R = { x: 60, y: 30, w: 120, h: 150 }; ctx.clearRect(0, 0, 240, 200);
  ctx.save(); jarPath(ctx, R); ctx.fillStyle = cs.getPropertyValue("--glass"); ctx.fill(); ctx.clip();
  const g = ctx.createLinearGradient(0, 80, 0, 180); g.addColorStop(0, cs.getPropertyValue("--water")); g.addColorStop(1, cs.getPropertyValue("--water2"));
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(R.x, 180); for (let x = 0; x <= R.w; x += 4) ctx.lineTo(R.x + x, 78 + Math.sin(x / 14) * 3); ctx.lineTo(R.x + R.w, 180); ctx.fill();
  ctx.fillStyle = cs.getPropertyValue("--gold"); [[95, 79], [140, 77]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 6, 3.4, .3, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore(); ctx.save(); jarPath(ctx, R); ctx.strokeStyle = cs.getPropertyValue("--line"); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
/* ---------- boot ---------- */
(function boot() {
  const cfg = CFG.firebase || {};
  if (!window.firebase || !cfg.apiKey || String(cfg.apiKey).includes("PASTE")) { showGate("config"); return; }
  firebase.initializeApp(cfg);
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); // stay signed in on this phone
  store.db = firebase.firestore();
  store.db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  window.addEventListener("online", schedule); window.addEventListener("offline", schedule);
  let started = false;
  firebase.auth().onAuthStateChanged(async user => {
    store.stopAll(); started = false;
    if (!user) { showGate("signin"); return; }
    const email = (user.email || "").toLowerCase();
    if (allowed.length && !allowed.includes(email)) { showGate("denied", user.email); return; }
    S.uid = user.uid; hideGate();
    if (started) return; started = true;
    render();
    const on = (path, key, after) => store.listen(path, rows => { S[key] = rows; after && after(); schedule(); });
    on("cats", "cats"); on("txns", "txns"); on("bills", "bills"); on("goals", "goals"); on("accts", "accts");
    on("members", "members", resolveNames);
    store.listen("meta", rows => { S.settings = rows.find(r => r.id === "settings") || {}; schedule(); });
    on(privPath(), "fun");
    try {
      const ref = store.db.collection("members").doc(S.uid), cur = (await ref.get()).data() || {};
      await ref.set({ joined: cur.joined || Date.now(), email, name: cur.name || cfgName(email) || (user.displayName || "").split(" ")[0] || "" }, { merge: true });
    } catch (e) {}
    try { await seedIfEmpty(); } catch (e) {}
  });
})();

/* first sign-in on a brand-new database: add the starter categories */
async function seedIfEmpty(force) {
  if (!force) { const snap = await store.db.collection("cats").limit(1).get(); if (!snap.empty) return; }
  const cats = [
    ["tithing", "Tithing", "fixed", 0, false], ["fastoffering", "Fast offerings", "fixed", .5, false],
    ["mortgage", "Mortgage / Rent", "fixed", 1, false], ["utilities", "Utilities", "fixed", 2, false], ["phone", "Phone & Internet", "fixed", 3, false],
    ["insurance", "Insurance", "fixed", 4, false], ["car", "Car payment", "fixed", 5, false],
    ["groceries", "Groceries", "flex", 10, false], ["dining", "Dining out", "flex", 11, false], ["gas", "Gas", "flex", 12, false],
    ["household", "Household", "flex", 13, false], ["kids", "Kids", "flex", 14, false], ["family", "Family & events", "flex", 15, false],
    ["carmaint", "Car maintenance", "nonmonthly", 20, true], ["gifts", "Gifts & holidays", "nonmonthly", 21, true], ["annual", "Annual subscriptions", "nonmonthly", 22, true]
  ];
  const batch = store.db.batch(), since = curMonth();
  cats.forEach(([id, name, group, order, rollover]) => batch.set(store.db.collection("cats").doc(id), { name, group, order, rollover, budget: 0, since }));
  batch.set(store.db.collection("meta").doc("settings"), { mode: "category", expectedIncome: 0, allowance: 0, bigPurchase: 0, tithing: true, tithePct: 10 }, { merge: true });
  await batch.commit();
}
})();
